name: Windows regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: build/global.json
      - name: Restore locked dependencies and audit NuGet packages
        run: dotnet restore WAVUtils.slnx --locked-mode -warnaserror
      - name: Build
        run: dotnet build WAVUtils.slnx -c Release --no-restore --nologo -v q -warnaserror
      - name: Test
        run: dotnet test WAVUtils.slnx -c Release --no-build --no-restore --nologo
      - name: Build packages without publishing
        run: .\build-release.ps1
